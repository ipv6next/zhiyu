<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>知遇 · 数字分身档案</title><link rel="stylesheet" href="premeet.css"></head>
<body class="discover-page twin-page"><main>
  <header class="twin-head"><a href="member.html" aria-label="返回会员中心">‹</a><b>数字分身</b><a class="twin-help" href="account.html" aria-label="账户中心">•••</a></header>
  <section class="twin-hero"><span class="twin-avatar">知</span><div><small>AI 预会面助手</small><h1>让分身理解你的价值观与相处方式</h1><p>它不会替你做重大承诺，只在日常聊天中自然表达你已确认的偏好。</p></div><b id="relationship-progress">加载中</b></section>
  <form id="twin-form">
    <article class="relationship-questionnaire"><div class="questionnaire-head"><div><small>核心价值观与相处方式题</small><h3>用情境认识真实的你</h3></div><span class="question-chip">可分次完成</span></div><p>共 11 道短情境题，没有标准答案。分身会在日常交流中自然参考，不会替你作重大承诺。</p><div id="relationship-questions"></div><div class="question-save"><button id="save-relationship-questions" type="button" class="secondary">保存本次回答</button><p id="relationship-note" class="subtle"></p></div></article>
    <details class="twin-details"><summary><span>💬</span><div><b>表达方式</b><small>让回复更接近你的聊天感觉</small></div><em>›</em></summary><div class="twin-detail-content"><label>回复节奏<select name="reply_length"><option>自然简洁</option><option>愿意多聊一点</option><option>慢热但认真</option></select></label><label>沟通方式<select name="directness"><option>温和直接</option><option>先倾听再表达</option><option>轻松幽默</option></select></label><label>互动感<select name="warmth"><option>有来有往</option><option>更重视共情</option><option>更重视实际行动</option></select></label></div></details>
    <details class="twin-details"><summary><span>♡</span><div><b>预会面优先议题</b><small>最多 3 项，优先了解对方</small></div><em>›</em></summary><div class="twin-detail-content"><p>候选真人只会看到议题类别，不会看到你的选择过程。</p><div id="topic-options"></div><button id="refresh-topics" type="button">换一组</button><label for="custom-topic">没有合适的？自己补充一项</label><div class="inputrow"><input id="custom-topic" maxlength="60" placeholder="例如：彼此怎样看待稳定联系"><button id="add-custom" type="button">加入</button></div><p id="topic-count" class="subtle"></p></div></details>
    <details class="twin-details"><summary><span>⌁</span><div><b>特别不希望分身回答</b><small>可选，仅填写特殊顾虑</small></div><em>›</em></summary><div class="twin-detail-content"><p>多数敏感话题已有系统规则；这里只处理你个人的例外。</p><div id="exception-options"></div><label for="custom-exception">其他不希望代答的内容</label><div class="inputrow"><input id="custom-exception" maxlength="60" placeholder="例如：我过去的一段具体经历"><button id="add-exception" type="button">加入</button></div><p id="exception-note" class="subtle"></p></div></details>
    <button class="primary twin-submit" type="submit">保存分身档案</button><p id="saved" class="subtle"></p>
  </form><p id="error" role="alert" hidden></p>
</main><script src="app.js"></script><script src="twin.js"></script></body></html>
