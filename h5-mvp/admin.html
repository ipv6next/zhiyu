<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知遇 · 运营后台</title><link rel="stylesheet" href="premeet.css"></head><body><main><header><a href="index.html">← 本地体验</a><span>知遇 · 运营后台</span><span class="badge">本地演示</span></header><section class="intro"><small>运营工作台</small><h1>用户、预会面与安全处理</h1><p>本地测试版采用模块化管理。真实上线须有独立运营登录、角色权限和操作审计。</p></section><nav class="tabs" id="tabs"><button data-tab="users" class="active">用户管理</button><button data-tab="rooms">预会面监控</button><button data-tab="reports">安全工单</button></nav><p id="notice" class="subtle"></p><section id="users-panel"><div class="filter-row"><input id="keyword" placeholder="搜索昵称或用户编号"><select id="account-filter"><option>全部</option><option>正常</option><option>已冻结</option></select><select id="verify-filter"><option>全部</option><option>未核验</option><option>核验中</option><option>已核验</option><option>核验异常</option></select><button id="search" class="secondary">查询</button></div><p class="subtle">本地测试：可在此模拟开通或关闭会员权益；正式版由支付成功回调驱动。</p><div class="table-wrap"><table><thead><tr><th>用户</th><th>身份</th><th>会员权益</th><th>核验</th><th>账户状态</th><th>活跃预会面</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></div><div class="pagination"><button id="prev" class="secondary">上一页</button><span id="pager"></span><button id="next" class="secondary">下一页</button></div></section><section id="rooms-panel" hidden><h2>需要关注的预会面</h2><div id="rooms"></div></section><section id="reports-panel" hidden><h2>安全工单</h2><div id="reports"></div></section></main><script src="admin.js"></script></body></html>
